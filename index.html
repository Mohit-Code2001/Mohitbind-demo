  <style>
    /* Global styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      /* font-size: 40px; */
    }
    
    /* Top section styles */
    .top-section {
      background: linear-gradient(to right, #6a00ff, #8e24aa);
      padding: 20px;
      text-align: center;
      color: white;
    }
    
    .top-section img.logo {

      height: 100px;
      margin-bottom: 10px;
    }
    
    /* Input section styles */
    .input-section {
      background: white;
      padding: 20px;
      text-align: center;
    }
    
    /* Input box styles */
    .input-container {
      position: relative;
      display: inline-block;
    }
    
    .input-container input[type="text"] {
      padding: 10px 74px;

    border: 2px solid;

    /* font-size: 40px; */
    }
    
    .input-container .input-icon {
      position: absolute;
      top: 50%;

      transform: translateY(-50%);
      color: black;
    }
    
    /* Continue button styles */
    .continue-button {
      background: linear-gradient(to right, #6a00ff, #8e24aa);
      color: #fff;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      justify-content: center; /* Center the button text horizontally */
      align-items: center; /* Center the button text vertically */
      margin: 20px auto; /* Center the button horizontally and add margin at the top */
      width: 85vw; /* Set the width of the button to 265 pixels */
      /* height: 6vh; Set the height of the button to 45 pixels */
      /* font-size: 40px; */
      margin-top: 3rem;
    }
    
    /* Star logo styles */
    .star-logo {
      display: block;
      margin: 20px auto;
      width: 85vw;
      margin-top: 5rem;
    }

    /* Loader styles */
    .loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 9999;
    }

    .loader-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }

    /* Popup styles */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9999;
    }

    .popup-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      background-color: #202020;
      width: 85vw;
      padding: 20px;
      border-radius: 5px;
    }

    /* Warning message styles */
    .warning-message {
      color: white;
      margin-top: 10px;
      background: linear-gradient(to right, #ff0000, #e60000);
      padding: 5px;
      border-radius: 5px;
    }

    /* Highlight styles */
    .highlight {
      border: 2px solid red;
    }

    /* Close button styles */
    #popup-close-button {
      background: linear-gradient(to right, #6a00ff, #8e24aa);
      color: #fff;
      padding: 20px 60px;
      border: none;

      cursor: pointer;

<body>
 
  <!-- Top section -->
  <div class="top-section">
    <h2>Trend Star</h2>
    <img src="https://i.imgur.com/KKBwhEC.png" alt="Logo" class="logo">
  </div>
  
    <center> 
  <!--Ads-->
  
  </center>
  
  <!-- Input section -->
  <div class="input-section">
    <h3>Please Enter Your BGMI id</h3>
    <div class="input-container">
      <input type="text" placeholder="Enter your Channel Link" id="username-input">
      <i class="fas fa-user input-icon"></i>
    </div>
    <button class="continue-button" id="continue-button">Continue</button>
    
  </div>
    <center> 
  <!--Ads-->
  
  </center>

  <!-- Star logo -->
  <img src="https://i.imgur.com/KKBwhEC.png" alt="Star Logo" class="star-logo">

  <!-- Loader screen -->
  <div class="loader">
    <div class="loader-content">
      <h3>Fetching Data From BGMI Server...</h3>
      <div class="loader-icon">
        <i class="fas fa-spinner fa-spin"></i>
      </div>
    </div>
  </div>

  <!-- Popup screen -->
  <div class="popup">
    <div class="popup-content">
      <h3 style="color: red;">Warning!</h3>
      <p class="warning-message" id="warning-message">Wrong BGMI Id</p>
      <button id="popup-close-button">Close</button>
    </div>
  </div>

  <!-- Add Font Awesome JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
  <script>
    // JavaScript code

    // Get references to the elements
    const inputField = document.getElementById('username-input');
    const continueButton = document.getElementById('continue-button');
    const warningMessage = document.getElementById('warning-message');
    const loader = document.querySelector('.loader');
    const popup = document.querySelector('.popup');
    const popupCloseButton = document.getElementById('popup-close-button');

    // Function to check if the input value is valid
    function isValidInput(inputValue) {
      return inputValue.length >= 6;
    }

    // Function to handle the continue button click event
    function handleContinueButtonClick() {
      // Get the input value
      const inputValue = inputField.value;

      // Check if the input value is valid
      if (isValidInput(inputValue)) {
        // Remove the highlight from the input field
        inputField.classList.remove('highlight');

        // Hide the warning message
        warningMessage.style.display = 'none';

        // Display the loader screen
        loader.style.display = 'block';

        // Simulate data fetching for 5 seconds
        setTimeout(() => {
          // Move to another page with the input value
          window.location.href = 'another-page.php?username=' + inputValue;
        }, 1800);
      } else {
        // Add highlight to the input field
        inputField.classList.add('highlight');

        // Show the warning message
        warningMessage.style.display = 'block';

        // Display the popup screen
        popup.style.display = 'block';
      }
    }

    // Function to handle the popup close button click event
    function handlePopupCloseButtonClick() {
      // Hide the popup
      popup.style.display = 'none';
    }

    // Add click event listener to the continue button
    continueButton.addEventListener('click', handleContinueButtonClick);

    // Add click event listener to the popup close button
    popupCloseButton.addEventListener('click', handlePopupCloseButtonClick);

    // Add input event listener to the input field
    inputField.addEventListener('input', () => {
      // Remove the highlight from the input field
      inputField.classList.remove('highlight');

      // Hide the warning message
      warningMessage.style.display = 'none';
    });
  </script>
</body>
